<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Converter</title>
    <meta name="description" content="Convert an amount between world currencies at the latest exchange rate, with a one-click swap." />
    <meta property="og:title" content="Currency Converter" />
    <meta property="og:description" content="Convert an amount between world currencies at the latest exchange rate, with a one-click swap." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://samarthjaiswal.github.io/Currency-Converter/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link href="style.css" rel="stylesheet" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="container">
      <h2>Currency Converter</h2>
      <form>
        <div class="amount">
          <label for="amount">Enter Amount</label>
          <input id="amount" value="1" type="number" min="0" step="any" inputmode="decimal" />
        </div>
        <div class="dropdown">
          <div class="from">
            <label for="from-currency">From</label>
            <div class="select-container">
              <img src="https://flagsapi.com/US/flat/64.png" alt="Flag for USD" />
              <select id="from-currency" name="from"></select>
            </div>
          </div>
          <button type="button" class="swap" aria-label="Swap currencies" title="Swap currencies">
            <i class="fa-solid fa-arrow-right-arrow-left" aria-hidden="true"></i>
          </button>
          <div class="to">
            <label for="to-currency">To</label>
            <div class="select-container">
              <img src="https://flagsapi.com/IN/flat/64.png" alt="Flag for INR" />
              <select id="to-currency" name="to"></select>
            </div>
          </div>
        </div>
        <div class="msg" aria-live="polite">Getting exchange rate...</div>
        <button type="submit" class="convert">Get Exchange Rate</button>
      </form>
    </div>
    <script src="codes.js"></script>
    <script src="app.js"></script>
  </body>
</html>
